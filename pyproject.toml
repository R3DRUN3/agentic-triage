[project]
name = "agentic-triage"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Security rules (S) are intentionally NOT enabled: bandit/gitleaks/trivy report
# those, and the agentic step triages them.
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["app"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
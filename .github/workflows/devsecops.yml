name: DevSecOps + Agentic Triage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  GITLEAKS_VERSION: "8.21.2"
  TRIVY_VERSION: "0.76.2"
  IMAGE_TAG: agentic-triage:ci

jobs:

  # ============================================================
  # 1. LINT
  # ============================================================
  lint:
    name: Lint (ruff, mypy, hadolint)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements-dev.txt

      - name: Collect lint reports
        run: |
          mkdir -p reports
          ruff check . --output-format=json --exit-zero > reports/ruff.json
          mypy > reports/mypy.txt || true

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          format: sarif
          output-file: reports/hadolint.sarif
          no-fail: false

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-lint
          path: reports/
          if-no-files-found: ignore

      - name: Enforce lint
        run: |
          set -e
          ruff check .
          mypy

  # ============================================================
  # 2. UNIT TESTS
  # ============================================================
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements-dev.txt

      - name: Pytest
        run: |
          mkdir -p reports
          python -m pytest --junitxml=reports/junit.xml \
            --cov=app \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=term

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-test
          path: reports/
          if-no-files-found: ignore

  # ============================================================
  # 3. SAST - BANDIT
  # ============================================================
  sast:
    name: SAST (bandit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: pip install "bandit[sarif,toml]==1.7.10"

      - name: Bandit
        run: |
          mkdir -p reports
          bandit -r app \
            -c pyproject.toml \
            -f sarif \
            -o reports/bandit.sarif

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-sast
          path: reports/
          if-no-files-found: ignore

  # ============================================================
  # 4. SECRET SCAN - GITLEAKS
  # ============================================================
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks

          sudo mv gitleaks /usr/local/bin/

      - name: Gitleaks
        run: |
          mkdir -p reports

          CONFIG_ARGS=""
          if [ -f .gitleaks.toml ]; then
            CONFIG_ARGS="--config .gitleaks.toml"
          else
            echo "::warning::.gitleaks.toml not found, using built-in default rules"
          fi

          gitleaks detect \
            --source . \
            $CONFIG_ARGS \
            --report-format sarif \
            --report-path reports/gitleaks.sarif \
            --redact \
            --exit-code 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-secrets
          path: reports/
          if-no-files-found: ignore

  # ============================================================
  # 5. TRIVY FILESYSTEM SCAN
  # ============================================================
  trivy_fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          set -euo pipefail

          BASE_URL="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          TARBALL="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"

          curl -sSfLO "${BASE_URL}/${TARBALL}"
          curl -sSfLO "${BASE_URL}/trivy_${TRIVY_VERSION}_checksums.txt"

          sha256sum --check --ignore-missing \
            "trivy_${TRIVY_VERSION}_checksums.txt"

          tar -xzf "${TARBALL}" trivy
          sudo mv trivy /usr/local/bin/

          rm -f "${TARBALL}" "trivy_${TRIVY_VERSION}_checksums.txt"

          trivy --version

      - name: Trivy filesystem scan
        run: |
          mkdir -p reports

          trivy fs . \
            --scanners vuln,misconfig,secret \
            --skip-dirs reports,.git \
            --severity CRITICAL,HIGH,MEDIUM \
            --format sarif \
            --output reports/trivy-fs.sarif \
            --exit-code 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-trivy-fs
          path: reports/
          if-no-files-found: ignore

  # ============================================================
  # 6. TRIVY CONTAINER IMAGE SCAN
  # ============================================================
  trivy_image:
    name: Trivy image scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          set -euo pipefail

          BASE_URL="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          TARBALL="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"

          curl -sSfLO "${BASE_URL}/${TARBALL}"
          curl -sSfLO "${BASE_URL}/trivy_${TRIVY_VERSION}_checksums.txt"

          sha256sum --check --ignore-missing \
            "trivy_${TRIVY_VERSION}_checksums.txt"

          tar -xzf "${TARBALL}" trivy
          sudo mv trivy /usr/local/bin/

          rm -f "${TARBALL}" "trivy_${TRIVY_VERSION}_checksums.txt"

          trivy --version

      - name: Build image
        run: docker build -t "$IMAGE_TAG" .

      - name: Trivy image scan
        run: |
          mkdir -p reports

          trivy image "$IMAGE_TAG" \
            --severity CRITICAL,HIGH,MEDIUM \
            --format sarif \
            --output reports/trivy-image.sarif \
            --exit-code 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-trivy-image
          path: reports/
          if-no-files-found: ignore

  # ============================================================
  # 7. AGENTIC TRIAGE - CODEX
  #
  # Recommendation-only mode.
  # Codex can write reports inside triage/ but must NEVER
  # modify application code, dependencies, tests or configuration.
  # ============================================================
  triage:
    name: Agentic triage

    needs:
      - lint
      - test
      - sast
      - secrets
      - trivy_fs
      - trivy_image

    if: ${{ always() && !cancelled() }}

    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      pull-requests: write

    env:
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT || vars.AZURE_OPENAI_DEPLOYMENT }}
      CODEX_VERSION: ${{ vars.CODEX_VERSION || 'latest' }}
      CODEX_SANDBOX: workspace-write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - uses: actions/download-artifact@v4
        with:
          pattern: reports-*
          path: reports
          merge-multiple: true

      - name: Normalize findings
        run: python scripts/build_findings.py --reports reports --out triage-input

      - name: Publish raw findings summary
        run: cat triage-input/findings.md >> "$GITHUB_STEP_SUMMARY"

      # Record the original repository state.
      - name: Record repository baseline
        run: |
          git status --porcelain --untracked-files=all \
            | grep -v '^?? triage/' \
            > "$RUNNER_TEMP/git-baseline.txt" || true

      - name: Preflight Azure model endpoint
        id: cfg
        run: |
          if [ -z "$AZURE_OPENAI_API_KEY" ] || [ -z "$AZURE_OPENAI_ENDPOINT" ] || [ -z "$AZURE_OPENAI_DEPLOYMENT" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Azure endpoint/key/deployment not available (fork PR or not configured). Skipping agent."
            exit 0
          fi

          BASE="${AZURE_OPENAI_ENDPOINT%/}"
          BASE="${BASE%/openai/v1}"
          BASE="${BASE%/openai}"
          BASE="${BASE}/openai/v1"

          probe() {
            local code
            code=$(curl -s -o probe.json -w '%{http_code}' -X POST "$BASE/$1" \
              -H "Authorization: Bearer $AZURE_OPENAI_API_KEY" \
              -H "Content-Type: application/json" -d "$2" || true)

            echo "POST /$1 -> HTTP $code"

            if [ "${code:0:1}" = "2" ]; then
              return 0
            fi

            head -c 400 probe.json
            echo
            return 1
          }

          RESP_BODY=$(jq -nc --arg m "$AZURE_OPENAI_DEPLOYMENT" \
            '{model:$m,input:"Reply with OK",max_output_tokens:64}')

          CHAT_BODY=$(jq -nc --arg m "$AZURE_OPENAI_DEPLOYMENT" \
            '{model:$m,messages:[{role:"user",content:"Reply with OK"}],max_tokens:32}')

          if probe responses "$RESP_BODY"; then
            WIRE=responses
          elif probe chat/completions "$CHAT_BODY"; then
            WIRE=chat
            echo "::warning::Deployment only supports chat/completions. Recent Codex versions require the Responses API. Pin an older CODEX_VERSION or use a Responses-capable deployment."
          else
            echo "::error::Deployment '$AZURE_OPENAI_DEPLOYMENT' failed on both /responses and /chat/completions. Check the deployment NAME, endpoint and key."
            exit 1
          fi

          rm -f probe.json

          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "CODEX_BASE_URL=$BASE" >> "$GITHUB_ENV"
          echo "CODEX_WIRE_API=$WIRE" >> "$GITHUB_ENV"

          echo "Using wire_api=$WIRE with deployment $AZURE_OPENAI_DEPLOYMENT"

      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.enabled == 'true'
        with:
          node-version: "20"

      - name: Install Codex CLI
        if: steps.cfg.outputs.enabled == 'true'
        run: npm install -g "@openai/codex@${CODEX_VERSION}"

      - name: Configure Codex
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/codex-home"

          cat > "$RUNNER_TEMP/codex-home/config.toml" <<EOF
          model = "${AZURE_OPENAI_DEPLOYMENT}"
          model_provider = "azure"
          approval_policy = "never"

          [model_providers.azure]
          name = "Azure Foundry"
          base_url = "${CODEX_BASE_URL}"
          env_key = "AZURE_OPENAI_API_KEY"
          wire_api = "${CODEX_WIRE_API}"
          EOF

          echo "CODEX_HOME=$RUNNER_TEMP/codex-home" >> "$GITHUB_ENV"

          codex --version

      # Codex can create reports but is instructed never to fix code.
      - name: Run Codex triage (recommendations only)
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          mkdir -p triage

          codex exec \
            --sandbox "$CODEX_SANDBOX" \
            --skip-git-repo-check \
            --output-last-message triage/last-message.md \
            - < .github/codex/triage-prompt.md

      # Fail if any repository changes occurred outside triage/.
      - name: Verify repository integrity
        id: verify
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          git status --porcelain --untracked-files=all \
            | grep -v '^?? triage/' \
            > "$RUNNER_TEMP/git-after.txt" || true

          if ! diff -u "$RUNNER_TEMP/git-baseline.txt" "$RUNNER_TEMP/git-after.txt"; then
            echo "::error::Repository files were modified during triage."
            exit 1
          fi

          echo "Repository integrity check passed."

      # Validate deliverables and ensure no fix was applied.
      - name: Validate and summarize triage output
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          set -euo pipefail

          if [ ! -s triage/triage.json ] || [ ! -s triage/report.md ]; then
            echo "::error::Agent did not produce valid non-empty triage deliverables."
            exit 1
          fi

          jq -e '
            (.summary | type == "object") and
            (.findings | type == "array") and
            all(.findings[];
              (.id | type == "string") and
              (.verdict == "true_positive" or
               .verdict == "false_positive" or
               .verdict == "needs_human") and
              (.confidence >= 0 and .confidence <= 1) and
              (.fix_applied == false)
            ) and
            (.summary.total == (.findings | length)) and
            (.summary.true_positive == ([.findings[] | select(.verdict == "true_positive")] | length)) and
            (.summary.false_positive == ([.findings[] | select(.verdict == "false_positive")] | length)) and
            (.summary.needs_human == ([.findings[] | select(.verdict == "needs_human")] | length))
          ' triage/triage.json > /dev/null

          EXPECTED=$(jq -r '[.[].id] | sort | .[]' triage-input/findings.json)
          ACTUAL=$(jq -r '[.findings[].id] | sort | .[]' triage/triage.json)

          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Finding IDs do not match input findings."
            diff <(printf '%s\n' "$EXPECTED") <(printf '%s\n' "$ACTUAL") || true
            exit 1
          fi

          EXPECTED_COUNT=$(jq '[.[].id] | unique | length' triage-input/findings.json)
          INPUT_COUNT=$(jq 'length' triage-input/findings.json)

          if [ "$EXPECTED_COUNT" != "$INPUT_COUNT" ]; then
            echo "::error::Input findings contain duplicate IDs."
            exit 1
          fi

          echo "## Agentic triage"
          echo ""
          echo "| Verdict | Count |"
          echo "|---|---|"
          jq -r '.summary |
            "| true_positive | \(.true_positive) |\n" +
            "| false_positive | \(.false_positive) |\n" +
            "| needs_human | \(.needs_human) |"' triage/triage.json

          {
            echo ""
            echo "Repository integrity check: **${{ steps.verify.outcome }}**"
            echo ""
            echo "Fixes applied: **None (recommendations only)**"
            echo ""
            cat triage/report.md
          } >> "$GITHUB_STEP_SUMMARY"

      # Comment on the pull request.
      - name: Comment on pull request
        if: steps.cfg.outputs.enabled == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "<!-- agentic-triage -->"
            echo "### Agentic triage report"
            echo ""
            head -c 60000 triage/report.md
            echo ""
            echo ""
            echo "_No code changes or patches were applied. All remediation actions are recommendations only._"
          } > triage/comment.md

          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file triage/comment.md --edit-last --create-if-none

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: triage-results
          path: |
            triage/
            triage-input/
          if-no-files-found: ignore


  # ============================================================
  # 8. FINAL PIPELINE GATE
  #
  # Fails if ANY required job did not succeed.
  # ============================================================
  gate:
    name: Final pipeline gate

    needs:
      - lint
      - test
      - sast
      - secrets
      - trivy_fs
      - trivy_image
      - triage

    if: ${{ always() && !cancelled() }}

    runs-on: ubuntu-latest

    steps:
      - name: Evaluate all pipeline results
        shell: bash
        run: |
          echo "======================================"
          echo "         PIPELINE RESULTS"
          echo "======================================"

          echo "Lint:          ${{ needs.lint.result }}"
          echo "Unit tests:    ${{ needs.test.result }}"
          echo "SAST:          ${{ needs.sast.result }}"
          echo "Secrets:       ${{ needs.secrets.result }}"
          echo "Trivy FS:      ${{ needs.trivy_fs.result }}"
          echo "Trivy Image:   ${{ needs.trivy_image.result }}"
          echo "Codex Triage:  ${{ needs.triage.result }}"

          echo "======================================"

          FAILED=0

          for RESULT in \
            "${{ needs.lint.result }}" \
            "${{ needs.test.result }}" \
            "${{ needs.sast.result }}" \
            "${{ needs.secrets.result }}" \
            "${{ needs.trivy_fs.result }}" \
            "${{ needs.trivy_image.result }}" \
            "${{ needs.triage.result }}"
          do
            if [ "$RESULT" != "success" ]; then
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Pipeline FAILED. At least one required job did not succeed."
            exit 1
          fi

          echo "All jobs completed successfully."
          echo "Pipeline PASSED."